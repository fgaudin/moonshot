<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonshot Flight Manual</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23132238'/%3E%3Cpath d='M20 6a11 11 0 1 0 0 20a9 9 0 1 1 0-20z' fill='%23f08a3c'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  // apply the saved theme before first paint (auto = follow the system setting)
  try { const t = localStorage.getItem('moonshot:theme'); if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t); } catch (e) { /* storage unavailable */ }
</script>
<script>
  window.MathJax = {
    loader: { load: ['[tex]/html'] },
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], packages: { '[+]': ['html'] } },
    svg: { fontCache: 'global' },
    startup: {
      ready() {
        // anything rendered before MathJax arrived is typeset once, as a whole page
        MathJax.startup.defaultReady();
        // tag Greek letters and symbols so they get name tooltips (js/symbols.js)
        MathJax.startup.input[0].preFilters.add(({ math }) => { if (window.Sym) math.math = Sym.texFilter(math.math); });
        MathJax.startup.promise.then(() => { if (window.Sym) Sym.hitAreas(document.body); });
        window.__pendingTypeset = [];
      }
    }
  };
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
</head>
<body>
<button class="btn menu-btn" id="menu-btn" aria-controls="rail" aria-expanded="false">☰ <span data-i18n="Flight plan">Flight plan</span></button>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Chapters">
    <a class="brand" href="#home"><b>Moon<span>shot</span></b><small data-i18n="A flight manual for astrodynamics">A flight manual for astrodynamics</small></a>
    <div class="rail-switches">
      <div class="seg lang-switch" id="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang-set="en" lang="en" title="English">EN</button>
        <button type="button" data-lang-set="fr" lang="fr" title="Français">FR</button>
        <button type="button" data-lang-set="de" lang="de" title="Deutsch">DE</button>
      </div>
    </div>
    <ol class="timeline" id="timeline"></ol>
    <div class="rail-bottom">
      <div class="seg theme-switch" id="theme-switch" role="group" aria-label="Colour theme" data-i18n-aria="Colour theme">
        <button type="button" data-theme-set="auto" title="Follow the system setting" data-i18n-title="Follow the system setting" data-i18n="Auto">Auto</button>
        <button type="button" data-theme-set="light" data-i18n="Light">Light</button>
        <button type="button" data-theme-set="dark" data-i18n="Dark">Dark</button>
      </div>
      <div class="rail-foot"><span data-i18n="All units SI. Constants in the Reference.">All units SI. Constants in the Reference.</span><br><span data-i18n="Progress is saved in this browser.">Progress is saved in this browser.</span></div>
    </div>
  </nav>
  <main id="main"><div class="page" id="page"></div></main>
</div>
<script src="js/physics.js"></script>
<script src="js/i18n.js"></script>

<script src="js/ch/navigation.js"></script>

<script src="js/ch/sounding.js"></script>

</html>
