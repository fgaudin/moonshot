<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    svg: { fontCache: 'global' },
    startup: {
      ready() {
        // anything rendered before MathJax arrived is typeset once, as a whole page
        MathJax.startup.defaultReady();
        window.__pendingTypeset = [];
      }
    }
  };
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

    <ol class="timeline" id="timeline"></ol>
    <div class="rail-foot">All units SI. Constants in the Reference.<br>Progress is saved in this browser.</div>
